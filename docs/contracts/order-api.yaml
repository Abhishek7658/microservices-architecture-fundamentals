
openapi: 3.1.0

info:
  title: BlackRoth Order API
  version: 1.0.0
  description: >-
    Client-facing Order API exposed through the API Gateway.
    The public path /api/orders is rewritten to the Order Service
    controller path /api/v1/orders. This contract documents the
    current implementation and identifies known limitations.

servers:
  - url: http://localhost:8080
    description: Local API Gateway

tags:
  - name: Orders
    description: Create and manage orders

paths:
  /api/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      description: >-
        Creates an order after validating the request and verifying
        that the referenced user exists. Requires an idempotency key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Client-provided key used to deduplicate order-creation
            retries. The service currently stores idempotency state
            in Redis.
          schema:
            type: string
            minLength: 1
        - name: X-Correlation-ID
          in: header
          required: false
          description: Request correlation identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              userId: 1
              productId: 1
              productName: Laptop
              quantity: 1
              amount: 65000.0
      responses:
        '201':
          description: Order created successfully or an existing idempotent result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentErrorResponse'
              example:
                timestamp: '2026-10-19T14:06:17.767127Z'
                status: 400
                error: Bad Request
                message: 'quantity: must be greater than or equal to 1'
                path: /api/v1/orders
                traceId: DAY1-ORDER-001
        '404':
          description: The referenced user does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentErrorResponse'
        '503':
          description: User Service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Orders]
      operationId: getAllOrders
      summary: List all orders
      description: Returns the current collection without pagination.
      responses:
        '200':
          description: Orders returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get an order by ID
      responses:
        '200':
          description: Order returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: >-
        The current implementation cancels the order and returns
        no response body.
      responses:
        '204':
          description: Order cancellation completed successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders/user/{userId}:
    get:
      tags: [Orders]
      operationId: getOrdersByUserId
      summary: List orders for a user
      parameters:
        - name: userId
          in: path
          required: true
          description: User identifier.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Matching orders returned; may be an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'

    put:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Update an order's status
      description: >-
        Updates the order status using the supplied string.
        The current DTO does not constrain the string to an enum
        of permitted status values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order identifier.
      schema:
        type: integer
        format: int64

  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - productId
        - productName
        - quantity
        - amount
      properties:
        userId:
          type: integer
          format: int64
          description: Required by the current DTO; positive-value validation is not declared.
        productId:
          type: integer
          format: int64
          description: Required by the current DTO; positive-value validation is not declared.
        productName:
          type: string
          description: Required by the current DTO; blank strings are not currently rejected.
        quantity:
          type: integer
          minimum: 1
          description: Must be at least 1.
        amount:
          type: number
          format: double
          minimum: 0
          description: >-
            The current Java DTO uses Double. BigDecimal or another
            decimal-safe representation is recommended for money.

    UpdateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          minLength: 1
          description: >-
            The current DTO uses @NotBlank. Allowed status values
            are not restricted by the DTO.

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        amount:
          type: number
          format: double
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CurrentErrorResponse:
      type: object
      description: >-
        Error response currently returned by the Order Service
        exception handler.
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - traceId
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: 'quantity: must be greater than or equal to 1'
        path:
          type: string
          example: /api/v1/orders
        traceId:
          type: string
          example: DAY1-ORDER-001

    ProposedStandardErrorResponse:
      type: object
      description: >-
        Proposed cross-service error format. Not yet implemented
        consistently across all microservices.
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - traceId
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        traceId:
          type: string

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentErrorResponse'

    NotFound:
      description: The requested order does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentErrorResponse'

    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentErrorResponse'
