spring.application.name=api-gateway
server.port=8080

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8090
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# Order Service
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RewritePath=/api/orders,/api/v1/orders


# Product Service - API v1
spring.cloud.gateway.server.webmvc.routes[2].id=product-service-v1
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/products,/api/products/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RewritePath=/api/products(?<remaining>/?.*),/api/v1/products${remaining}

# Product Service - API v2
spring.cloud.gateway.server.webmvc.routes[4].id=product-service-v2
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v2/products,/api/v2/products/**

# Payment Service
spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RewritePath=/api/payments,/payments
# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Maximum allowed request body: 1 MiB
gateway.request.max-body-size=1048576